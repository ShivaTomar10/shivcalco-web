<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShivCalco | Advanced Laboratory & Molecular Biology Calculator</title>
  <meta name="description" content="Free online Advanced Laboratory Calculator for molecular biology, PCR master mix, DNA Tm & reverse complement, molarity, serial dilution, RCF/RPM centrifugation, and PDF/image tools." />
  <meta name="keywords" content="ShivCalco, lab calculator, PCR master mix calculator, DNA melting temperature, molarity calculator, serial dilution calculator, RCF to RPM converter" />
  <link rel="canonical" href="https://shivcalco.top" />
  <style>
    :root { --bg: #0b1120; --panel: #111827; --border: #1f2937; --text: #f8fafc; --muted: #94a3b8; --accent: #06b6d4; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    .container { max-width: 1200px; margin: 0 auto; padding: 1.2rem; }
    .hero { padding: 1.2rem 1.5rem; border-radius: 12px; background: linear-gradient(115deg, #10243a, #164e63); margin-bottom: 1rem; }
    .hero h1 { margin: 0 0 0.25rem; font-size: 1.7rem; }
    .hero p { margin: 0; color: #dbeafe; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; }
    .card h2 { margin: 0 0 0.6rem; font-size: 1.15rem; color: #38bdf8; }
    input { width: 100%; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 7px; padding: 0.55rem; margin-bottom: 0.6rem; }
    .btn { background: var(--accent); color: #082f49; border: none; padding: 0.55rem 1.2rem; border-radius: 7px; font-weight: 700; cursor: pointer; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-top: 0.8rem; }
    .metric { background: #162032; border: 1px solid #26354d; padding: 0.75rem; border-radius: 9px; }
    .metric-label { font-size: 0.8rem; color: var(--muted); }
    .metric-val { font-size: 1.25rem; font-weight: 700; margin-top: 0.15rem; }
    .code-box { background: #090d16; border: 1px solid #1e293b; padding: 0.7rem; border-radius: 7px; font-family: monospace; color: #38bdf8; margin-top: 0.6rem; word-break: break-all; }
  </style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>🧪 ShivCalco — Advanced Laboratory Calculator</h1>
    <p>Fast, private server-powered molecular biology and laboratory calculations.</p>
  </div>

  <div class="card">
    <h2>🧬 DNA Sequence Analyzer</h2>
    <input type="text" id="dna_seq" value="ATCGATCGATCGATCGATCGATCGATCGATCG" placeholder="Paste DNA sequence (5' -> 3')" />
    <button class="btn" onclick="runDna()">Analyze Sequence</button>
    <div id="dna_status" style="color:#94a3b8;font-size:0.85rem;margin-top:0.4rem;"></div>
    <div class="metrics" id="dna_metrics"></div>
    <div class="code-box" id="dna_rc" style="display:none;"></div>
  </div>
</div>

<script>
  const API_BASE = "https://onrender.com";

  async function runDna() {
    const seq = document.getElementById("dna_seq").value;
    const status = document.getElementById("dna_status");
    status.innerText = "Calculating...";
    try {
      const res = await fetch(`${API_BASE}/api/dna`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sequence: seq })
      });
      const data = await res.json();
      if (data.error) { status.innerText = data.error; return; }
      status.innerText = data.warning || data.counts;
      document.getElementById("dna_metrics").innerHTML = `
        <div class="metric"><div class="metric-label">Length</div><div class="metric-val">${data.length}</div></div>
        <div class="metric"><div class="metric-label">GC Content</div><div class="metric-val">${data.gc_pct}</div></div>
        <div class="metric"><div class="metric-label">Wallace Tm</div><div class="metric-val">${data.tm_wallace}</div></div>
        <div class="metric"><div class="metric-label">Basic GC Tm</div><div class="metric-val">${data.tm_gc}</div></div>
      `;
      const rcBox = document.getElementById("dna_rc");
      rcBox.style.display = "block";
      rcBox.innerText = "Reverse Complement: " + data.rc;
    } catch (err) {
      status.innerText = "Server waking up—click Analyze Sequence again in 15 seconds.";
    }
  }
  runDna();
</script>
</body>
</html>
